[project]
name = "test-work"
version = "0.1.0"
description = ""
authors = [
    {name = "Muhammad",email = "m.ibragimov271@mail.ru"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.143.1,<0.144.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "celery[redis] (>=5.6.3,<6.0.0)",
    "aiohttp (>=3.14.5,<4.0.0)",
    "dishka (>=1.10.1,<2.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "alembic (>=1.20.0,<2.0.0)"
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
